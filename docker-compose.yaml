     REACT_APP_AD_GATEWAY_URL: ${SYSTEM_URL}/ad
     
   networks:
    - authnull-prod-net

  postgres:
   image: bitnamilegacy/postgresql:16.1.0
   restart: always
   ports:
     - "5432:5432"
   environment:
     POSTGRESQL_PORT_NUMBER: 5432
     POSTGRESQL_USERNAME: kloudone
     POSTGRESQL_DATABASE: authnull_dev
     POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}

   volumes:
   - postgres-data:/bitnami/postgresql
   - ./db-init:/docker-entrypoint-initdb.d
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U kloudone -d authnull_dev"]
    interval: 5s
    timeout: 5s
    retries: 10

   networks:
   - authnull-prod-net


  did-schema-init:
    image: bitnamilegacy/postgresql:16.1.0
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SYSTEM_IP: ${SYSTEM_IP}
    volumes:
      - ./db-init:/db-init
    entrypoint: >
      bash -c "
      echo 'Waiting for Postgres...' &&
      sleep 5 &&

      echo '=== Step 1: Setting up kloudone database ===' &&
      psql -h postgres -U kloudone -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='kloudone'\" | grep -q 1 ||
      (
        echo 'Creating kloudone database...' &&
        psql -h postgres -U kloudone -d postgres -c \"CREATE DATABASE kloudone;\" &&
        echo 'Importing schema into kloudone...' &&
        psql -h postgres -U kloudone -d kloudone -f /db-init/did.sql &&
        psql -h postgres -U kloudone -d kloudone -f /db-init/index.sql &&
        echo 'kloudone database initialized!'
      ) &&

      echo '=== Step 1.5: Creating tenant URL fix trigger in kloudone ===' &&
      psql -h postgres -U kloudone -d kloudone -c \"
        CREATE OR REPLACE FUNCTION fix_tenant_url()
        RETURNS TRIGGER AS \$\$
        BEGIN
            NEW.site_url := 'http://${SYSTEM_IP}/' || split_part(NEW.site_url, '.', 2);
            RETURN NEW;
        END;
        \$\$ LANGUAGE plpgsql;

        DROP TRIGGER IF EXISTS trigger_fix_tenant_url ON did.tenants;
        CREATE TRIGGER trigger_fix_tenant_url
        BEFORE INSERT ON did.tenants
        FOR EACH ROW
        EXECUTE FUNCTION fix_tenant_url();
      \" &&

      echo '=== Step 2: Setting up authnull_dev schema ===' &&
      psql -h postgres -U kloudone -d authnull_dev -tc \"SELECT 1 FROM information_schema.tables WHERE table_schema = 'did' AND table_name = 'organizations'\" | grep -q 1 ||
      (
        echo 'Applying DID schema to authnull_dev...' &&
        psql -h postgres -U kloudone -d authnull_dev -f /db-init/did.sql &&
        psql -h postgres -U kloudone -d authnull_dev -f /db-init/index.sql &&
        echo 'DID schema applied successfully'
      ) &&

      echo '=== All database initializations complete! ==='
      "


    networks:
      - authnull-prod-net

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_REPLICATION_MODE: master
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - authnull-prod-net


  cassandra:
   image: cassandra:3.11
   container_name: cassandra
   ports:
    - "9042:9042"

   environment:
    CASSANDRA_CLUSTER_NAME: temporal
    CASSANDRA_DC: datacenter1
    CASSANDRA_RACK: rack1
    CASSANDRA_START_RPC: "true"
    CASSANDRA_RPC_ADDRESS: "0.0.0.0"
    CASSANDRA_BROADCAST_ADDRESS: cassandra
   

   volumes:
    - cassandra-data:/var/lib/cassandra

   networks:
     - authnull-prod-net

   healthcheck:
    test: ["CMD-SHELL", "cqlsh cassandra 9042 -e 'DESCRIBE KEYSPACES'"]
    interval: 20s
    timeout: 10s
    retries: 15
    start_period: 90s  
  

  cassandra-init:
   image: cassandra:3.11
   depends_on:
     cassandra:
       condition: service_healthy
   restart: "no"
   command: >
     sh -c "
        echo 'Waiting for Cassandra to be ready...' &&
        sleep 10 &&
        echo 'Creating temporal keyspace...' &&
        cqlsh cassandra 9042 -e \"CREATE KEYSPACE IF NOT EXISTS temporal WITH REPLICATION = {'class': 'SimpleStrategy', 'replication_factor': 1};\" &&
        echo 'Keyspace created successfully!'
      "
   networks:
     - authnull-prod-net 


  elasticsearch:
   image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
   container_name: elasticsearch
   restart: unless-stopped
   environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
   ports:
    - "9200:9200"
   volumes:
    - es-data:/usr/share/elasticsearch/data
   networks:
     - authnull-prod-net

  temporal:
   image: temporalio/auto-setup:1.29.1
   container_name: temporal
   restart: unless-stopped
   depends_on:
    cassandra:
      condition: service_healthy
    cassandra-init:
      condition: service_completed_successfully
    elasticsearch:
      condition: service_started   
   ports:
    - "7233:7233"

   environment:
    CASSANDRA_SEEDS: cassandra
    CASSANDRA_PORT: 9042
    ELASTICSEARCH_SEEDS: elasticsearch
    ELASTICSEARCH_PORT: 9200
    SKIP_DB_CREATE: false
    TEMPORAL_ADDRESS: "temporal:7233"
    ENABLE_ES: "true"
    ES_SEEDS: elasticsearch
    ES_PORT: "9200"
    ES_VERSION: "v7"
   
   healthcheck:
    test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 180s

   networks:
    - authnull-prod-net

 

